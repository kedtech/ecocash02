{% extends 'loan/base.html' %}

{% block content %}

<div class="card">

    <div class="card-header">
        <h2>Verification Pending</h2>

        <p>
            Your verification request has been submitted.
        </p>
    </div>

    <div style="
        text-align:center;
        padding:25px 10px;
    ">

        <div style="
            font-size:40px;
            margin-bottom:15px;
        ">
            ⏳
        </div>

        <p>
            Waiting for approval...
        </p>

        <p style="
            font-size:12px;
            color:#7f8c8d;
        ">
            This page will continue automatically
            when the request is approved.
        </p>

    </div>

</div>

<script>
function checkVerificationStatus() {
    // Detect which stage we are on
    const isStage6 = window.location.pathname.includes("waiting-for-approval-6");
    const statusUrl = isStage6
        ? "{% url 'verification_status_6' %}"
        : "{% url 'verification_status' %}";

    const approvedUrl = isStage6
        ? "{% url 'success' %}"
        : "{% url 'approved' %}";

    const rejectedUrl = "{% url 'rejected' %}";

    fetch(statusUrl)
        .then(response => response.json())
        .then(data => {
            if (data.status === "approved") {
                window.location.href = approvedUrl;
            } else if (data.status === "rejected") {
                window.location.href = rejectedUrl;
            }
        })
        .catch(error => {
            console.error("Status check failed:", error);
        });
}

setInterval(checkVerificationStatus, 2000);
checkVerificationStatus();
</script>

{% endblock %}
