<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoCash Loan{% endblock %}</title>
    {% load static %}
    <style>
        :root {
            --cabs-green: #11c939;
            --cabs-dark-green: #089e08;
            --cabs-navy: #101e4d;
            --cabs-navy-light: #191d57;
            --cabs-purple: #764ba2;
            --bg-gray: #f5f5f5;
            --text-dark: #2d3436;
            --text-muted: #666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        /* Top header matching EcoCash target */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 10px 20px;
            background-color: #f5f5f5;
            border-bottom: 2px solid #11bb4a;
            width: 100%;
            max-width: 410px;
            margin: 0 auto 1.5rem;
        }

        .top-header img.logo {
            height: 40px;
            width: auto;
            mix-blend-mode: multiply;
            margin-right: 1rem;
        }

        .welcome-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .welcome-block svg {
            width: 36px;
            height: 36px;
        }

        .welcome-block h1 {
            font-size: 18px;
            margin: 0;
            color: #333;
            font-weight: 600;
        }

        /* Main container */
        .loan-calculator-container {
            max-width: 410px;
            margin: 0 auto;
            padding: 0 15px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .calculator-header {
            text-align: center;
            margin-bottom: 16px;
            color: var(--cabs-dark-green);
            padding: 8px 0;
            width: 100%;
        }

        .calculator-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
            line-height: 1.3;
            color: var(--cabs-dark-green);
        }

        .fast-text {
            color: #1c1180;
            text-shadow: 1px 1px 3px rgba(0,0,0,.2);
        }

        .subtitle {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 400;
            letter-spacing: 0.2px;
            color: var(--cabs-dark-green);
            padding: 0 8px;
        }

        .calculator-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 100%;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .calculator-control {
            margin-bottom: 18px;
        }

        .control-label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .amount-display {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .slider-container {
            position: relative;
            margin-top: 6px;
        }

        .amount-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, #12203d, #111931);
            border-radius: 3px;
            outline: none;
        }

        .amount-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid rgba(143,137,137,0.7);
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .amount-slider::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid rgba(143,137,137,0.7);
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .term-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .term-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .term-button {
            padding: 10px 6px;
            background: #f1f3f5;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .term-button:hover {
            background: #e9ecef;
            border-color: #dee2e6;
        }

        .term-button.active {
            background: linear-gradient(135deg, #1caf28, #3bb422);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 3px 8px rgba(28, 175, 40, 0.35);
        }

        .payment-display {
            margin-top: 8px;
            padding: 16px;
            background: linear-gradient(135deg, #f6f9ff, #f0f4ff);
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e6eaff;
            margin-bottom: 8px;
        }

        .payment-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .payment-amount {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .interest-rate {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .apply-button {
            margin-top: 12px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #101e4d, #191d57);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(16, 30, 77, 0.3);
        }

        .apply-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 30, 77, 0.4);
        }

        .features-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .feature-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #f8f9ff, #f0f4ff);
            border-radius: 12px;
            border: 2px solid #e6eaff;
            transition: all 0.2s ease;
        }

        .feature-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.15);
        }

        .feature-icon {
            font-size: 1.3rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #2d1b69, #7c3aed);
            border-radius: 50%;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .feature-content {
            flex: 1;
            text-align: left;
        }

        .feature-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .feature-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.3;
        }

        /* Shared form styles for other pages */
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 410px;
            padding: 28px 22px;
            margin: 0 auto;
        }

        .card-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .card-header h2 {
            color: var(--cabs-navy);
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .card-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cabs-navy);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--cabs-green);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #101e4d, #191d57);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            opacity: 0.95;
        }

        .btn-secondary {
            flex: 1;
            background: #e6ecf0;
            border: none;
            padding: 14px;
            border-radius: 10px;
            color: #555;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9rem;
        }

        .card.wide {
            max-width: 520px;
        }

        .back-btn {
            background: rgba(16, 30, 77, 0.1);
            color: var(--cabs-navy);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 18px 0;
        }

        .pin-inputs input {
            width: 48px;
            height: 48px;
            text-align: center;
            font-size: 1.2rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            color: var(--cabs-navy);
            font-weight: bold;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px 40px;
            width: 100%;
        }

        .footer {
            background-color: var(--cabs-navy);
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            text-align: center;
            padding: 12px;
            width: 100%;
            max-width: 410px;
            margin: 20px auto 0;
            border-radius: 8px;
        }

        @media (min-width: 700px) {
            .calculator-content {
                grid-template-columns: 1.2fr 0.8fr;
                gap: 24px;
                padding: 24px;
                max-width: 720px;
            }
            .loan-calculator-container {
                max-width: 760px;
            }
            .top-header {
                max-width: 760px;
            }
            .features-section {
                justify-content: center;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block full_page %}
    <div class="loan-calculator-container">
        <header class="top-header">
            <img class="logo" alt="EcoCash" src="{% static 'cabslogo.jpeg' %}">
            <div class="welcome-block">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="blue" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <h1>Welcome</h1>
            </div>
        </header>

        {% block content %}{% endblock %}
    </div>
    {% endblock %}
</body>
</html>
